# База знаний: все работают в одной ветке (context) и отправляют через агента: python3 kb/tools/kb.py push.
# CI на каждом push в context: проверка и номера + сводки. Задача kb-after-merge идёт строго по одной (resource_group).
# Нужен токен с правом push в context: переменная KB_PUSH_TOKEN (Settings → CI/CD → Variables).
# context: разрешите push для Developers (Settings → Repository → Protected branches → Allowed to push),
# иначе kb.py push будет отклонён. Другое имя ветки — KB_BRANCH ниже и поле «основная ветка» в kb/team.md.

variables:
  KB_BRANCH: context

stages: [check, after-merge]

kb-check:
  stage: check
  image: python:3.12-slim
  script:
    - python3 kb/tools/kb.py check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $KB_BRANCH && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/

kb-after-merge:
  stage: after-merge
  image: python:3.12-slim
  resource_group: kb-context
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - git config user.name "CI"
    - git config user.email "ci@local"
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - git pull --rebase origin "$CI_COMMIT_BRANCH"
  script:
    - python3 kb/tools/kb.py after-merge
    # Проверка после нумерации не блокирует: ошибки увидит дежурный в дайджесте, номера и сводки должны уйти в любом случае
    - python3 kb/tools/kb.py check || echo "kb-check после after-merge: есть ошибки, смотрите вывод выше"
    - |
      if [ -n "$(git status --porcelain)" ]; then
        git add -A
        git commit -m "kb: номера и сводки [skip ci]"
        git push "https://oauth2:${KB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:$CI_COMMIT_BRANCH"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $KB_BRANCH && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
